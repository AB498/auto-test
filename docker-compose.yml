# Pick ONE backend with a profile:
#   docker compose --profile laravel up --build
#   docker compose --profile node up --build
# Both serve the same API on port 8000; the frontend talks to whichever is running.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: orderdesk
      MYSQL_USER: orderdesk
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  backend-laravel:
    profiles: [laravel]
    build: ./backend-laravel
    volumes:
      - ./backend-laravel:/app
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: orderdesk
      DB_USERNAME: orderdesk
      DB_PASSWORD: secret
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      default:
        aliases: [backend]
    depends_on:
      mysql:
        condition: service_healthy

  backend-node:
    profiles: [node]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./backend-node:/app
      - backend_node_modules:/app/node_modules
    environment:
      PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: orderdesk
      DB_USERNAME: orderdesk
      DB_PASSWORD: secret
      DB_TEST_DATABASE: orderdesk_test
    # Fresh, seeded database on every boot so everyone starts from the same data.
    command: sh -c "npm ci && npm run db:seed && npm run dev"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      default:
        aliases: [backend]
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://backend:8000
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  frontend_node_modules:
  backend_node_modules:
